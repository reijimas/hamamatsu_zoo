<main>

</main>

<script src="animals-data.js"></script>
<script>

function getAnimalNameFromURL(){
  const params = new URLSearchParams(window.location.search);
  return params.get("name");
}

function findAnimal(name){
  return ANIMALS_DATA.find(a => a.name === name);
}

function renderNotFound(root, name){
  root.innerHTML = `
    <div class="not-found">
      <h1>どうぶつが見つかりませんでした</h1>
      <p>「${name ?? ""}」という名前のページは準備中か、見つかりませんでした。</p>
      <p style="margin-top:14px;"><a href="index.html">← トップページへもどる</a></p>
    </div>
  `;
}

function renderAnimal(root, animal){
  document.getElementById("pageTitle").textContent =
    `${animal.name} | まもろう！どうぶつたち in はまZOO`;

  const photoHTML = (animal.image && animal.image !== "placeholder")
    ? `<div class="animal-photo"><img src="${animal.image}" alt="${animal.name}"></div>`
    : `<div class="animal-photo is-placeholder">
         <div class="paw">🐾</div>
         <div>ここに写真が入ります</div>
       </div>`;

  const descPlaceholder = !animal.description || animal.description.includes("ここに解説文が入ります");
  const descClass = descPlaceholder ? "animal-desc-text is-placeholder" : "animal-desc-text";

  root.innerHTML = `
    <div class="animal-detail">
      ${photoHTML}
      <div>
        <h1 class="animal-name">${animal.name}</h1>
        <div class="animal-desc-card">
          <div class="animal-desc-label">すみか</div>
          <p class="${descClass}">${animal.area ?? "エリア情報（仮）"}</p>
        </div>
        <div class="animal-desc-card">
          <div class="animal-desc-label">かいせつ</div>
          <p class="${descClass}">${animal.description ?? ""}</p>
        </div>
      </div>
    </div>
  `;
}

(function init(){
  const root = document.getElementById("animalRoot");
  const name = getAnimalNameFromURL();
  const animal = name ? findAnimal(name) : null;

  if (animal){
    renderAnimal(root, animal);
  } else {
    renderNotFound(root, name);
  }
})();

</script>
